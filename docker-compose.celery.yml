# Override: run AI processing on Celery workers instead of inside the API process.
#
#   docker compose -f docker-compose.yml -f docker-compose.celery.yml up --build
#
# Adds Redis (broker) and a Chroma server. The embedded Chroma store can't be shared
# safely between processes, so the API and the workers both talk to the server.
# Keep the chroma image version equal to chromadb in backend/requirements.txt.

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data

  backend:
    environment:
      TASK_QUEUE: celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      RUN_MIGRATIONS: "false"
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://talkwise:talkwise@postgres:5432/talkwiseai
      DATABASE_SYNC_URL: postgresql://talkwise:talkwise@postgres:5432/talkwiseai
      STORAGE_LOCAL_PATH: /app/storage
      TASK_QUEUE: celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    volumes:
      - backend-storage:/app/storage   # uploads are read from the same volume the API writes
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  chroma-data:
