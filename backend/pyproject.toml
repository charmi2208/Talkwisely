[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkwiseai-backend"
version = "1.0.0"
description = "TalkWiseAI — AI-Powered Meeting, Call & Sales Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    # FastAPI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",

    # AI / LLM
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",

    # STT
    "openai-whisper>=20231117",

    # Embeddings / Vector DB
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Task queue
    "celery>=5.4.0",
    "redis>=5.0.0",

    # File processing
    "python-magic>=0.4.27",
    "pydub>=0.25.1",
    "aiofiles>=23.2.1",

    # PDF generation
    "reportlab>=4.2.0",
    "weasyprint>=62.0",

    # Document processing (knowledge base)
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",

    # HTTP client
    "httpx>=0.27.0",

    # Utilities
    "python-slugify>=8.0.4",
    "rich>=13.7.1",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
