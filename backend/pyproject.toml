[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkwiseai-backend"
version = "1.0.0"
description = "TalkWiseAI — AI-Powered Meeting, Call & Sales Intelligence Platform Backend"
requires-python = ">=3.11"
# Pinned, tested versions live in requirements.txt (used by Docker and the setup guide).
dependencies = [
    # FastAPI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",

    # AI pipeline (LangGraph orchestration, OpenAI-compatible LLM and Whisper APIs)
    "langgraph>=1.0.0",
    "openai>=1.30.0",
    "tenacity>=8.3.0",

    # Vector search (local ONNX embeddings ship with chromadb)
    "chromadb>=1.0.0",

    # Task queue (only needed with TASK_QUEUE=celery)
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Files, knowledge base and report exports
    "aiofiles>=23.2.1",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",

    # HTTP client and utilities
    "httpx>=0.27.0",
    "python-slugify>=8.0.4",
    "rich>=13.7.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# Transcribe on your own machine instead of a hosted API (STT_PROVIDER=whisper_local)
local-whisper = ["openai-whisper>=20231117"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.0.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the app's async engine is created once at import
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["evaluation: AI evaluation runs (need a real LLM; skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
